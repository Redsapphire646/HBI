<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBI — Sidequest 3.1: OR, AND und Klammern</title>
<style>
  :root{
    --bg1:#0a0f24; --bg2:#131c3d; --gold:#d4af37; --gold-dim:#8f7a3f;
    --fg:#eae6d8; --papier:#efe6cf; --tinte:#2b1d14; --gruen:#9fe59f; --rot:#e0735f; --orange:#f0a04b;
    --serif: Georgia, "Times New Roman", serif;
    --mono: Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;height:100%;background:#05070f;}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--fg);}

  #buehne{
    position:relative; width:min(100vw, 177.78vh); aspect-ratio:16/9; overflow:hidden;
    container-type:inline-size; background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg1) 60%);
  }
  #gehirn-hud{position:absolute;top:3.5%;left:2.5%;display:flex;flex-direction:column;gap:.35cqw;
    background:rgba(10,15,36,.8);border:1px solid var(--gold-dim);padding:.6cqw 1.1cqw;font-size:max(15px,1.9cqw);}
  #gehirn-hud .hud-label{font-size:max(9px,.8cqw);letter-spacing:.25em;color:var(--gold-dim);}
  #kopf{position:absolute;top:3.5%;left:0;right:0;text-align:center;pointer-events:none;}
  #kopf .kicker{letter-spacing:.35em;font-size:max(10px,.9cqw);color:var(--gold-dim);}
  #kopf h1{margin:.15em 0 0;color:var(--gold);font-size:max(20px,2.8cqw);text-shadow:0 0 18px rgba(212,175,55,.3);}
  #zurueck{position:absolute;top:3.5%;right:2.5%;font-family:var(--serif);font-size:max(11px,1cqw);
    background:rgba(10,15,36,.8);color:var(--gold);border:1px solid var(--gold-dim);padding:.4cqw .9cqw;cursor:pointer;}
  #zurueck:hover{background:rgba(212,175,55,.12);}

  #maske{position:absolute;left:5%;right:5%;top:24%;bottom:2.5%;display:flex;flex-direction:column;gap:.8cqw;padding:1.1cqw 1.4cqw;
    background:#0b1020;border:2px solid var(--gold-dim);box-shadow:0 0 3cqw rgba(212,175,55,.15);
    font-family:var(--mono);font-size:max(11px,1.1cqw);overflow:auto;}
  #maske > *{flex:none;}
  #maske header{display:flex;justify-content:space-between;align-items:center;color:var(--gold);letter-spacing:.08em;
    border-bottom:1px solid var(--gold-dim);padding-bottom:.6cqw;}
  #punkte{display:flex;gap:.5cqw;}
  #punkte i{display:block;width:1.1cqw;height:1.1cqw;border-radius:50%;border:1px solid var(--gold-dim);}
  #punkte i.aktuell{border-color:var(--gold);box-shadow:0 0 .6cqw rgba(212,175,55,.6);}
  #punkte i.fertig{background:var(--gruen);border-color:var(--gruen);}

  #info{border:1px solid var(--gruen);border-left-width:.35cqw;background:rgba(159,229,159,.06);padding:.7cqw 1cqw;line-height:1.5;color:#e8dcc0;}
  #info .a-kopf{color:var(--gruen);letter-spacing:.12em;font-size:.85em;margin-bottom:.3em;}
  #info b{color:var(--orange);}
  #info.geschafft{border-color:var(--gold);background:rgba(212,175,55,.08);}
  #info.geschafft .a-kopf{color:var(--gold);}

  .papier{background:var(--papier);color:var(--tinte);padding:.8cqw 1cqw;font-family:var(--serif);font-size:max(13px,1.35cqw);line-height:1.4;
    box-shadow:0 .2cqw .6cqw rgba(0,0,0,.4);border-left:.35cqw solid #8b2e1f;}
  .papier b.kicker{display:block;letter-spacing:.2em;font-size:.6em;color:#8b2e1f;margin-bottom:.3em;}
  .papier u{text-decoration-thickness:.12em;}
  .code{display:block;background:#050810;color:var(--gruen);font-family:var(--mono);font-size:1.2em;padding:.55em .8em;border:1px dashed #2c3a2c;overflow-wrap:anywhere;}
  .code .op{color:var(--orange);font-weight:bold;}

  /* Teil 1: Karteikarten antippen */
  #karten{display:grid;grid-template-columns:repeat(6,1fr);gap:.8cqw;}
  .kk{font:inherit;text-align:left;cursor:pointer;background:var(--papier);color:var(--tinte);padding:.5cqw .7cqw;font-family:var(--serif);
    border:none;border-top:.35cqw solid #8b2e1f;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.4);outline:3px solid transparent;outline-offset:2px;transition:outline-color .15s, opacity .15s;}
  .kk strong{display:block;font-size:max(11px,1.1cqw);margin-bottom:.25em;}
  .kk span{display:block;font-size:max(10px,.9cqw);opacity:.75;}
  .kk span.hl{opacity:1;font-weight:bold;}
  .kk:hover:not(:disabled),.kk:focus-visible{outline-color:rgba(212,175,55,.6);}
  .kk.an{outline-color:var(--gold);}
  .kk.an::after{content:'✓ im Ergebnis';display:block;margin-top:.3em;font-size:.85em;color:#8b2e1f;font-weight:bold;}
  .kk.richtig{outline-color:var(--gruen);}
  .kk.falsch{outline-color:var(--rot);}
  .kk:disabled{cursor:default;}

  /* Teil 2: Klammern setzen */
  #bau{display:flex;flex-wrap:wrap;align-items:center;gap:.4cqw .5cqw;background:#050810;border:1px dashed #2c3a2c;padding:.8cqw 1cqw;font-size:1.15em;}
  #bau .fest{color:var(--gruen);}
  #bau .op{color:var(--orange);font-weight:bold;}
  #bau .bed{color:var(--gruen);background:rgba(159,229,159,.08);border:1px solid #2c3a2c;padding:.15em .5em;}
  .slot{font:inherit;font-weight:bold;width:1.9em;height:1.9em;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    background:none;color:#5f6a7d;border:1px dashed #3b475e;border-radius:.4em;}
  .slot:hover:not(:disabled),.slot:focus-visible{border-color:var(--gold);color:var(--gold);outline:none;}
  .slot.an{color:#0b1020;background:var(--gold);border:1px solid var(--gold);font-size:1.2em;}
  .slot:disabled{cursor:default;}

  .knoepfe{display:flex;justify-content:flex-end;gap:.8cqw;}
  .knoepfe button{font:inherit;cursor:pointer;padding:.45cqw 1.4cqw;border:1px solid var(--gold);background:none;color:var(--gold);}
  #pruefen{background:var(--gold);color:#0b1020;font-weight:bold;}
  #weiter{color:var(--gruen);border-color:var(--gruen);font-weight:bold;}
  #meldung{min-height:1.4em;line-height:1.45;}
  #meldung.fehler{color:var(--rot);} #meldung.ok{color:var(--gruen);}

  #fertig{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2cqw;background:rgba(5,8,18,.9);}
  #fertig h2{margin:0;color:var(--gold);font-size:max(22px,3.6cqw);text-shadow:0 0 18px rgba(212,175,55,.3);}
  #fertig p{margin:0;max-width:56%;color:#d6d1c0;font-size:max(13px,1.5cqw);line-height:1.5;}
  #fertig button{font-family:var(--serif);font-size:max(13px,1.3cqw);background:none;color:var(--gold);border:1px solid var(--gold);padding:.6cqw 1.6cqw;cursor:pointer;margin-top:.6cqw;}
  #fertig button:hover{background:rgba(212,175,55,.12);}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:0s !important;transition-duration:0s !important;} }
</style>
</head>
<body>
<div id="buehne">
  <div id="gehirn-hud" title="Energie"><div class="hud-label">ENERGIE</div><div id="hud-energie"></div></div>
  <div id="kopf"><div class="kicker">SIDEQUEST 3.1</div><h1>OR, AND und Klammern</h1></div>
  <button type="button" id="zurueck">◂ Zur Zentrale</button>

  <div id="maske" role="group" aria-label="OR, AND und Klammern">
    <header><span id="kopfzeile">TEIL 1</span><span id="punkte" aria-hidden="true"></span></header>
    <div id="info"><div class="a-kopf"></div><div class="a-text"></div></div>
    <div id="inhalt"></div>
    <div id="meldung" role="status"></div>
    <div class="knoepfe"><button type="button" id="pruefen">✓ Prüfen</button><button type="button" id="weiter" hidden>Weiter ▸</button></div>
  </div>

  <div id="fertig" hidden>
    <h2>Geschafft!</h2>
    <p id="fertig-text"></p>
    <button type="button" id="fertig-weiter">Zurück zur Zentrale ▸</button>
  </div>
</div>

<script src="spielstand.js"></script>
<script src="../daten/personen.js" charset="utf-8"></script>
<script src="sql-asm.js" charset="utf-8"></script>
<script src="sql-meldungen.js" charset="utf-8"></script>
<script src="sql-szene.js" charset="utf-8"></script>
<script>
/* ============================================================
   TEIL 1 — OR und AND: Welche Karteikarten erscheinen im Ergebnis?
   karten = Namen aus der Datenbank (Karteikarte zeigt immer geschlecht, herkunft, epoche, wirkungsbereich);
   a / b = die beiden Bedingungen { spalte, wert }; op = 'OR' oder 'AND'. Die Lösung wird aus den Daten berechnet.
   ============================================================ */
var FELDER = ['geschlecht', 'herkunft', 'epoche', 'wirkungsbereich'];
var SATZ1 = ['Claude Monet', 'Napoleon Bonaparte', 'Pablo Picasso', 'Albert Einstein', 'Marie Curie', 'Wolfgang Amadeus Mozart'];
var SATZ2 = ['Kleopatra VII.', 'Sappho', 'Marie Curie', 'Platon', 'Albert Einstein', 'Wolfgang Amadeus Mozart'];
var TEIL1 = [
  { karten:SATZ1, op:'OR',  a:{ spalte:'herkunft', wert:'Frankreich' }, b:{ spalte:'wirkungsbereich', wert:'Kunst' },
    merke:'OR = „oder“: Es genügt, wenn eine Bedingung stimmt. Darum erscheinen mehr Personen.' },
  { karten:SATZ1, op:'AND', a:{ spalte:'herkunft', wert:'Frankreich' }, b:{ spalte:'wirkungsbereich', wert:'Kunst' },
    merke:'AND = „und“: Beide Bedingungen müssen gleichzeitig stimmen. Darum erscheinen weniger Personen.' },
  { karten:SATZ2, op:'AND', a:{ spalte:'geschlecht', wert:'weiblich' }, b:{ spalte:'epoche', wert:'Antike' },
    merke:'Auch hier gilt: Mit AND muss die Person beides sein — weiblich und aus der Antike.' }
];
TEIL1.forEach(function(t){
  t.personen = t.karten.map(function(n){
    var p = DATEN.filter(function(x){ return x.name === n; })[0];
    if (!p) console.warn('Datensatz: „' + n + '“ nicht gefunden');
    return p;
  });
  t.soll = t.personen.filter(function(p){
    var x = p[t.a.spalte] === t.a.wert, y = p[t.b.spalte] === t.b.wert;
    return t.op === 'OR' ? (x || y) : (x && y);
  });
});

/* ============================================================
   TEIL 2 — Klammern setzen. Der Code steht schon da, die Klammern fehlen. In Worten steht, was er aussagen soll.
   teile: Bedingungen (text) und die Operatoren dazwischen (ops). soll() = Filter für das erwartete Ergebnis.
   ============================================================ */
var TEIL2 = [
  { auftrag:'Zeige alle Personen, die <u>Maler oder Bildhauer</u> sind <u>und</u> aus der <u>Schweiz</u> kommen.',
    art:'zeigen', teile:["taetigkeit = 'Maler'", "taetigkeit = 'Bildhauer'", "herkunft = 'Schweiz'"], ops:['OR', 'AND'],
    soll:function(p){ return (p.taetigkeit === 'Maler' || p.taetigkeit === 'Bildhauer') && p.herkunft === 'Schweiz'; } },
  { auftrag:'Zeige alle Personen aus dem <u>wirkungsbereich Sport</u>, die aus der <u>Schweiz oder aus Deutschland</u> kommen.',
    art:'zeigen', teile:["wirkungsbereich = 'Sport'", "herkunft = 'Schweiz'", "herkunft = 'Deutschland'"], ops:['AND', 'OR'],
    soll:function(p){ return p.wirkungsbereich === 'Sport' && (p.herkunft === 'Schweiz' || p.herkunft === 'Deutschland'); } },
  { auftrag:'Wie viele Personen kommen aus <u>Frankreich oder Italien</u> und sind <u>weiblich</u>?',
    art:'zaehlen', teile:["herkunft = 'Frankreich'", "herkunft = 'Italien'", "geschlecht = 'weiblich'"], ops:['OR', 'AND'],
    soll:function(p){ return (p.herkunft === 'Frankreich' || p.herkunft === 'Italien') && p.geschlecht === 'weiblich'; } }
];
TEIL2.forEach(function(t){
  t.treffer = DATEN.filter(t.soll);
  if (!t.treffer.length) console.warn('Datensatz: Teil-2-Aufgabe ohne Treffer');
  t.vorsatz = t.art === 'zeigen' ? 'SELECT * FROM personen WHERE' : 'SELECT COUNT(*) FROM personen WHERE';
});

/* ---- Ton ---- */
var ctx = null, master = null;
function tonStart(){ if (ctx) return; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination); }
function ton(freq, dauer, typ, laut, verz){ if (!ctx || ctx.state !== 'running') return;
  var t = ctx.currentTime + (verz || 0), o = ctx.createOscillator(), g = ctx.createGain();
  o.type = typ || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(laut || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dauer + 0.02); }
var KLANG = {
  klick: function(){ ton(900, 0.05, 'triangle', 0.15); },
  erfolg: function(){ ton(523, 0.3, 'sine', 0.2); ton(659, 0.3, 'sine', 0.2, 0.1); ton(784, 0.5, 'sine', 0.2, 0.2); },
  fehler: function(){ ton(160, 0.18, 'sawtooth', 0.12); ton(120, 0.25, 'sawtooth', 0.12, 0.12); },
  geschafft: function(){
    [523, 659, 784, 1047].forEach(function(f, i){ ton(f, 0.28, 'triangle', 0.2, i * 0.11); });
    ton(1047, 0.9, 'sine', 0.16, 0.44); ton(1319, 0.9, 'sine', 0.12, 0.44); ton(1568, 0.9, 'sine', 0.1, 0.44);
    ton(2093, 0.18, 'sine', 0.07, 0.6); ton(2637, 0.18, 'sine', 0.06, 0.7);
  }
};
tonStart();
document.addEventListener('pointerdown', function(){ if (ctx && ctx.state !== 'running') ctx.resume(); });
function klang(n){ try { KLANG[n](); } catch (e) {} }

var $ = function(id){ return document.getElementById(id); };
Spiel.zeichneEnergie($('hud-energie'));
function meldung(art, text){ $('meldung').className = art; $('meldung').textContent = text; }
function gleicheMenge(a, b){ return a.length === b.length && a.every(function(p){ return b.indexOf(p) >= 0; }); }

/* ---- Ablauf: Schritte 0..2 = Teil 1, 3..5 = Teil 2 ---- */
var schritt = 0, erledigt = false;
var GESAMT = TEIL1.length + TEIL2.length;
for (var i = 0; i < GESAMT; i++) $('punkte').appendChild(document.createElement('i'));

function zeigeSchritt(){
  erledigt = false;
  var teil1 = schritt < TEIL1.length;
  Array.prototype.forEach.call($('punkte').children, function(p, k){ p.className = k < schritt ? 'fertig' : k === schritt ? 'aktuell' : ''; });
  $('inhalt').innerHTML = ''; meldung('', '');
  $('weiter').hidden = true; $('pruefen').hidden = false; $('pruefen').disabled = false;
  var info = $('info'); info.classList.remove('geschafft');
  if (teil1) {
    var n = schritt;
    $('kopfzeile').textContent = 'TEIL 1 · OR UND AND · ' + (n + 1) + ' VON ' + TEIL1.length;
    info.querySelector('.a-kopf').textContent = 'MERKE DIR';
    info.querySelector('.a-text').innerHTML = '<b>OR</b> heisst „oder“: Es genügt, wenn <i>eine</i> Bedingung stimmt. <b>AND</b> heisst „und“: <i>Beide</i> Bedingungen müssen stimmen.';
    baueTeil1(TEIL1[n]);
  } else {
    var m = schritt - TEIL1.length;
    $('kopfzeile').textContent = 'TEIL 2 · KLAMMERN SETZEN · ' + (m + 1) + ' VON ' + TEIL2.length;
    info.querySelector('.a-kopf').textContent = 'KLAMMERN';
    info.querySelector('.a-text').innerHTML = 'Was in der Klammer steht, wird <i>zuerst</i> gerechnet. Ohne Klammern gilt: <b>AND</b> bindet stärker als <b>OR</b>. Klicke auf die gestrichelten Felder, um Klammern zu setzen oder wieder zu entfernen.';
    baueTeil2(TEIL2[m]);
  }
}

/* ---- Teil 1 ---- */
var gewaehlt = [];
function bedText(b){ return b.spalte + " = '" + b.wert + "'"; }
function baueTeil1(t){
  gewaehlt = [];
  var f = document.createElement('div'); f.className = 'papier';
  f.innerHTML = '<b class="kicker">FRAGE</b>Welche Personen erscheinen im Ergebnis dieser Abfrage? Klicke ihre Karteikarten an.';
  $('inhalt').appendChild(f);
  var c = document.createElement('code'); c.className = 'code'; c.style.margin = '.8cqw 0';
  c.innerHTML = 'SELECT * FROM personen WHERE ' + bedText(t.a) + ' <span class="op">' + t.op + '</span> ' + bedText(t.b);
  $('inhalt').appendChild(c);
  var raster = document.createElement('div'); raster.id = 'karten'; $('inhalt').appendChild(raster);
  t.personen.forEach(function(p){
    var k = document.createElement('button'); k.type = 'button'; k.className = 'kk';
    var html = '<strong>' + SqlSzene.text(p.name) + '</strong>';
    FELDER.forEach(function(s){ html += '<span class="' + ((s === t.a.spalte || s === t.b.spalte) ? 'hl' : '') + '">' + s + ': ' + SqlSzene.text(p[s]) + '</span>'; });
    k.innerHTML = html;
    k.onclick = function(){
      if (erledigt) return;
      var i = gewaehlt.indexOf(p);
      if (i >= 0) { gewaehlt.splice(i, 1); k.classList.remove('an'); } else { gewaehlt.push(p); k.classList.add('an'); }
      klang('klick');
    };
    k._p = p; raster.appendChild(k);
  });
}
function pruefeTeil1(){
  var t = TEIL1[schritt];
  if (!gewaehlt.length) { meldung('fehler', 'Klicke die Karteikarten an, die im Ergebnis erscheinen.'); klang('fehler'); return; }
  var falsch = 0;
  Array.prototype.forEach.call(document.querySelectorAll('.kk'), function(k){
    var soll = t.soll.indexOf(k._p) >= 0, ist = gewaehlt.indexOf(k._p) >= 0;
    if (soll !== ist) falsch++;
  });
  if (falsch) {
    meldung('fehler', 'Noch nicht ganz: ' + (falsch === 1 ? 'Eine Karte stimmt' : falsch + ' Karten stimmen') + ' nicht. Prüfe jede Person: Trifft ' + (t.op === 'OR' ? 'mindestens eine' : 'jede') + ' Bedingung zu?');
    klang('fehler'); return;
  }
  erledigt = true;
  Array.prototype.forEach.call(document.querySelectorAll('.kk'), function(k){ k.classList.remove('an'); k.disabled = true; if (t.soll.indexOf(k._p) >= 0) k.classList.add('richtig'); });
  erfolg(t.merke);
}

/* ---- Teil 2 ---- */
var klammern = [];   // pro Bedingung: { auf:bool, zu:bool }
function baueTeil2(t){
  klammern = t.teile.map(function(){ return { auf:false, zu:false }; });
  var f = document.createElement('div'); f.className = 'papier';
  f.innerHTML = '<b class="kicker">DER CODE SOLL AUSSAGEN</b>' + t.auftrag;
  $('inhalt').appendChild(f);
  var bau = document.createElement('div'); bau.id = 'bau'; bau.style.marginTop = '.8cqw'; $('inhalt').appendChild(bau);
  zeichneBau(t);
}
function zeichneBau(t){
  var bau = $('bau'); bau.innerHTML = '';
  var vor = document.createElement('span'); vor.className = 'fest'; vor.textContent = t.vorsatz; bau.appendChild(vor);
  t.teile.forEach(function(text, i){
    bau.appendChild(slot(i, 'auf', '('));
    var b = document.createElement('span'); b.className = 'bed'; b.textContent = text; bau.appendChild(b);
    bau.appendChild(slot(i, 'zu', ')'));
    if (i < t.ops.length) { var o = document.createElement('span'); o.className = 'op'; o.textContent = t.ops[i]; bau.appendChild(o); }
  });
}
function slot(i, art, zeichen){
  var s = document.createElement('button'); s.type = 'button'; s.className = 'slot' + (klammern[i][art] ? ' an' : ''); s.disabled = erledigt;
  s.textContent = klammern[i][art] ? zeichen : '·'; s.setAttribute('aria-label', (zeichen === '(' ? 'Klammer auf' : 'Klammer zu') + ' bei Bedingung ' + (i + 1));
  s.onclick = function(){ if (erledigt) return; klammern[i][art] = !klammern[i][art]; klang('klick'); zeichneBau(TEIL2[schritt - TEIL1.length]); };
  return s;
}
function sqlAus(t){
  var s = t.vorsatz;
  t.teile.forEach(function(text, i){
    s += ' ' + (klammern[i].auf ? '(' : '') + text + (klammern[i].zu ? ')' : '');
    if (i < t.ops.length) s += ' ' + t.ops[i];
  });
  return s;
}
function pruefeTeil2(){
  var t = TEIL2[schritt - TEIL1.length];
  var anz = klammern.reduce(function(n, k){ return n + (k.auf ? 1 : 0) + (k.zu ? 1 : 0); }, 0);
  if (!anz) { meldung('fehler', 'Setze zuerst die Klammern: Was soll zusammengehören?'); klang('fehler'); return; }
  var auf = klammern.filter(function(k){ return k.auf; }).length, zu = klammern.filter(function(k){ return k.zu; }).length;
  if (auf !== zu) { meldung('fehler', 'Zu jeder öffnenden Klammer „(“ gehört eine schliessende „)“.'); klang('fehler'); return; }
  var r;
  try { r = SqlSzene.abfrage(sqlAus(t)); }
  catch (e) { meldung('fehler', 'Die Klammern sind so gesetzt, dass die Abfrage nicht funktioniert. Eine „(“ muss vor der „)“ stehen.'); klang('fehler'); return; }
  var gut = t.art === 'zaehlen' ? r.wert === t.treffer.length : (r.art === 'personen' && gleicheMenge(r.zeilen, t.treffer));
  if (!gut) { meldung('fehler', 'Das sagt etwas anderes aus als der Auftrag. Überlege: Was gehört zusammen? Das kommt in die Klammer.'); klang('fehler'); return; }
  erledigt = true; zeichneBau(t);
  erfolg('Richtig! Die Klammer fasst zusammen, was zusammengehört' + (t.art === 'zaehlen' ? ': ' + r.wert + ' Personen.' : ': ' + r.zeilen.length + (r.zeilen.length === 1 ? ' Person.' : ' Personen.')));
}

/* ---- Gemeinsam ---- */
function erfolg(text){
  meldung('ok', text);
  Array.prototype.forEach.call($('punkte').children, function(p, k){ if (k <= schritt) p.className = 'fertig'; });
  if (schritt === TEIL1.length - 1) { var i = $('info'); i.classList.add('geschafft'); i.querySelector('.a-kopf').textContent = 'TEIL 1 GESCHAFFT'; }
  $('pruefen').hidden = true; $('weiter').textContent = schritt + 1 < GESAMT ? (schritt + 1 === TEIL1.length ? 'Weiter zu den Klammern ▸' : 'Weiter ▸') : 'Fertig ▸';
  $('weiter').hidden = false; klang('erfolg'); $('weiter').focus();
  $('weiter').scrollIntoView({ block:'nearest' });
}
$('pruefen').onclick = function(){ if (erledigt) return; if (schritt < TEIL1.length) pruefeTeil1(); else pruefeTeil2(); };
$('weiter').onclick = function(){
  klang('klick');
  if (schritt + 1 < GESAMT) { schritt++; zeigeSchritt(); } else fertig();
};

function fertig(){
  var erstesMal = Spiel.sidequestGeschafft('3.1');
  if (erstesMal) Spiel.energiePlus(1);
  klang('geschafft');
  $('fertig-text').textContent = erstesMal
    ? 'OR, AND und Klammern sitzen. Dein Gehirn hat einen Energiebalken gewonnen.'
    : 'OR, AND und Klammern sitzen. Die Energie für diese Sidequest hattest du schon.';
  $('fertig').hidden = false;
}
function zurKarte(){ location.href = Spiel.url('zentrale.html', { z:3, r:1 }); }      // zurück in die Hauptzentrale
$('zurueck').onclick = zurKarte;
$('fertig-weiter').onclick = zurKarte;
zeigeSchritt();
</script>
