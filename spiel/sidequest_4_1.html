<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBI — Sidequest 4.1: Kleiner oder grösser</title>
<style>
  :root{
    --bg1:#0a0f24; --bg2:#131c3d; --gold:#d4af37; --gold-dim:#8f7a3f;
    --fg:#eae6d8; --papier:#efe6cf; --tinte:#2b1d14; --gruen:#9fe59f; --rot:#e0735f; --teal:#4fd1c5; --orange:#f0a04b;
    --serif: Georgia, "Times New Roman", serif;
    --mono: Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;height:100%;background:#05070f;}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--fg);}

  #buehne{
    position:relative; width:min(100vw, 177.78vh); aspect-ratio:16/9; overflow:hidden;
    container-type:inline-size; background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg1) 60%);
  }
  #gehirn-hud{position:absolute;top:3.5%;left:2.5%;display:flex;flex-direction:column;gap:.35cqw;
    background:rgba(10,15,36,.8);border:1px solid var(--gold-dim);padding:.6cqw 1.1cqw;font-size:max(15px,1.9cqw);}
  #gehirn-hud .hud-label{font-size:max(9px,.8cqw);letter-spacing:.25em;color:var(--gold-dim);}
  #kopf{position:absolute;top:3.5%;left:0;right:0;text-align:center;pointer-events:none;}
  #kopf .kicker{letter-spacing:.35em;font-size:max(10px,.9cqw);color:var(--gold-dim);}
  #kopf h1{margin:.15em 0 0;color:var(--gold);font-size:max(20px,2.8cqw);text-shadow:0 0 18px rgba(212,175,55,.3);}
  #zurueck{position:absolute;top:3.5%;right:2.5%;font-family:var(--serif);font-size:max(11px,1cqw);
    background:rgba(10,15,36,.8);color:var(--gold);border:1px solid var(--gold-dim);padding:.4cqw .9cqw;cursor:pointer;}
  #zurueck:hover{background:rgba(212,175,55,.12);}

  #maske{position:absolute;left:5%;right:5%;top:24%;bottom:2.5%;display:flex;flex-direction:column;gap:.7cqw;padding:1cqw 1.4cqw;
    background:#0b1020;border:2px solid var(--gold-dim);box-shadow:0 0 3cqw rgba(212,175,55,.15);
    font-family:var(--mono);font-size:max(11px,1.1cqw);overflow:auto;}
  #maske > *{flex:none;}
  #maske header{display:flex;justify-content:space-between;align-items:center;color:var(--gold);letter-spacing:.08em;
    border-bottom:1px solid var(--gold-dim);padding-bottom:.6cqw;}
  #punkte{display:flex;gap:.5cqw;}
  #punkte i{display:block;width:1.1cqw;height:1.1cqw;border-radius:50%;border:1px solid var(--gold-dim);}
  #punkte i.aktuell{border-color:var(--gold);box-shadow:0 0 .6cqw rgba(212,175,55,.6);}
  #punkte i.fertig{background:var(--gruen);border-color:var(--gruen);}

  #info{display:grid;grid-template-columns:1fr 1fr;gap:1cqw;}
  .merk br{display:none;}
  .merk{border:1px solid var(--gruen);border-left-width:.35cqw;background:rgba(159,229,159,.06);padding:.4cqw 1cqw;line-height:1.45;color:#e8dcc0;}
  .merk .zeichen{display:inline-block;min-width:1.4em;text-align:center;color:var(--teal);font-weight:bold;font-size:1.5em;vertical-align:middle;margin-right:.3em;}
  .merk b{color:var(--gruen);}
  .merk b::after{content:':';margin-right:.5em;}
  .papier{background:var(--papier);color:var(--tinte);padding:.8cqw 1cqw;font-family:var(--serif);font-size:max(13px,1.4cqw);line-height:1.4;
    box-shadow:0 .2cqw .6cqw rgba(0,0,0,.4);border-left:.35cqw solid #8b2e1f;}
  .papier b.kicker{display:block;letter-spacing:.2em;font-size:.6em;color:#8b2e1f;margin-bottom:.3em;}
  .papier u{text-decoration-thickness:.12em;}

  #bau{display:flex;flex-wrap:wrap;align-items:center;gap:.4cqw .6cqw;background:#050810;border:1px dashed #2c3a2c;padding:.6cqw 1.2cqw;font-size:1.25em;color:var(--gruen);}
  .luecke{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:2.2em;border:2px dashed var(--gold-dim);border-radius:.4em;
    color:var(--gold);font-weight:bold;font-size:1.1em;cursor:pointer;background:rgba(212,175,55,.05);}
  .luecke.ueber{border-color:var(--gold);background:rgba(212,175,55,.2);}
  .luecke.voll{border-style:solid;background:var(--teal);border-color:var(--teal);color:#0b1020;}
  .luecke.richtig{background:var(--gruen);border-color:var(--gruen);}
  .luecke.falsch{background:var(--rot);border-color:var(--rot);}
  #vorrat{display:flex;align-items:center;gap:1cqw;}
  #vorrat .b-label{color:#b9b6ad;}
  .zeichen-tile{font:inherit;font-weight:bold;font-size:1.6em;width:2.2em;height:1.6em;display:inline-flex;align-items:center;justify-content:center;cursor:grab;
    background:var(--teal);color:#0b1020;border:none;border-radius:.4em;box-shadow:0 .15cqw 0 rgba(0,0,0,.45), inset 0 -.15cqw 0 rgba(0,0,0,.18);user-select:none;}
  .zeichen-tile:active{cursor:grabbing;}
  .zeichen-tile.gewaehlt{outline:3px solid var(--fg);outline-offset:2px;}
  .zeile{display:flex;align-items:center;justify-content:space-between;gap:1cqw;}
  .zeile #meldung{flex:1;}
  .knoepfe{display:flex;justify-content:flex-end;gap:.8cqw;}
  .knoepfe button{font:inherit;cursor:pointer;padding:.45cqw 1.4cqw;border:1px solid var(--gold);background:none;color:var(--gold);}
  #pruefen{background:var(--gold);color:#0b1020;font-weight:bold;}
  #weiter{color:var(--gruen);border-color:var(--gruen);font-weight:bold;}
  #meldung{min-height:1.4em;line-height:1.45;}
  #meldung.fehler{color:var(--rot);} #meldung.ok{color:var(--gruen);}

  #ausgabe{flex:1 1 0;min-height:0;overflow:auto;padding:1cqw .2cqw 0;border-top:1px solid rgba(143,122,63,.4);}
  #ausgabe:empty{border-top-color:transparent;}
  .treffer{color:var(--gold);margin-bottom:.8cqw;letter-spacing:.05em;}
  .karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(120px,13cqw),1fr));gap:.8cqw;}
  .karte{background:var(--papier);color:var(--tinte);padding:.6cqw .8cqw;font-family:var(--serif);
    border-top:.35cqw solid #8b2e1f;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.4);animation:rein .25s ease-out both;}
  .karte strong{display:block;font-size:1.05em;margin-bottom:.2em;}
  .karte span{display:block;font-size:.85em;opacity:.8;}
  @keyframes rein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #fertig{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2cqw;background:rgba(5,8,18,.9);}
  #fertig h2{margin:0;color:var(--gold);font-size:max(22px,3.6cqw);text-shadow:0 0 18px rgba(212,175,55,.3);}
  #fertig p{margin:0;max-width:56%;color:#d6d1c0;font-size:max(13px,1.5cqw);line-height:1.5;}
  #fertig button{font-family:var(--serif);font-size:max(13px,1.3cqw);background:none;color:var(--gold);border:1px solid var(--gold);padding:.6cqw 1.6cqw;cursor:pointer;margin-top:.6cqw;}
  #fertig button:hover{background:rgba(212,175,55,.12);}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:0s !important;transition-duration:0s !important;} }
</style>
</head>
<body>
<div id="buehne">
  <div id="gehirn-hud" title="Energie"><div class="hud-label">ENERGIE</div><div id="hud-energie"></div></div>
  <div id="kopf"><div class="kicker">SIDEQUEST 4.1</div><h1>Kleiner oder grösser?</h1></div>
  <button type="button" id="zurueck">◂ Zur Zentrale</button>

  <div id="maske" role="group" aria-label="Kleiner oder grösser">
    <header><span id="kopfzeile">AUFGABE</span><span id="punkte" aria-hidden="true"></span></header>
    <div id="info">
      <div class="merk"><span class="zeichen">&lt;</span><b>kleiner als</b><br>Der Wert ist <i>kleiner</i>: bei Jahren also <i>früher</i>.</div>
      <div class="merk"><span class="zeichen">&gt;</span><b>grösser als</b><br>Der Wert ist <i>grösser</i>: bei Jahren also <i>später</i>.</div>
    </div>
    <div id="auftrag" class="papier"></div>
    <div id="bau" aria-label="Code mit Lücken"></div>
    <div id="vorrat"><span class="b-label">Ziehe das richtige Zeichen in die Lücke.</span>
      <button type="button" class="zeichen-tile" draggable="true" data-z="&lt;" aria-label="kleiner als">&lt;</button>
      <button type="button" class="zeichen-tile" draggable="true" data-z="&gt;" aria-label="grösser als">&gt;</button>
    </div>
    <div class="zeile"><div id="meldung" role="status"></div>
    <div class="knoepfe"><button type="button" id="pruefen">✓ Prüfen</button><button type="button" id="weiter" hidden>Weiter ▸</button></div></div>
    <div id="ausgabe"></div>
  </div>

  <div id="fertig" hidden>
    <h2>Geschafft!</h2>
    <p id="fertig-text"></p>
    <button type="button" id="fertig-weiter">Zurück zur Zentrale ▸</button>
  </div>
</div>

<script src="spielstand.js"></script>
<script src="../daten/personen.js" charset="utf-8"></script>
<script src="sql-asm.js" charset="utf-8"></script>
<script src="sql-meldungen.js" charset="utf-8"></script>
<script src="sql-szene.js" charset="utf-8"></script>
<script>
/* ============================================================
   AUFGABEN — Der Befehl steht in Worten da, der Code ist fertig bis auf < und >, die per Drag and Drop in die Lücken kommen.
   segs: Textstücke; eine Zahl = die Nummer der Lücke. loes = richtige Zeichen in der Reihenfolge der Lücken.
   frage = Denkanstoss je Lücke (verrät die Lösung nicht).
   ============================================================ */
var AUFGABEN = [
  { wort:'Zeige alle Personen, die <u>vor dem Jahr 1000</u> geboren wurden.',
    segs:['SELECT * FROM personen WHERE geburtsjahr', 0, '1000'], loes:['<'],
    frage:['Vor dem Jahr 1000: Muss das geburtsjahr dann kleiner oder grösser als 1000 sein?'] },
  { wort:'Wie viele Personen wurden <u>nach dem Jahr 1950</u> geboren?',
    segs:['SELECT COUNT(*) FROM personen WHERE geburtsjahr', 0, '1950'], loes:['>'],
    frage:['Nach dem Jahr 1950: Muss das geburtsjahr dann kleiner oder grösser als 1950 sein?'] },
  { wort:'Zeige alle Personen, die <u>nach 1900 geboren</u> wurden <u>und</u> <u>vor 1950 gestorben</u> sind.',
    segs:['SELECT * FROM personen WHERE geburtsjahr', 0, '1900 AND todesjahr', 1, '1950'], loes:['>', '<'],
    frage:['Nach 1900 geboren: Muss das geburtsjahr kleiner oder grösser als 1900 sein?', 'Vor 1950 gestorben: Muss das todesjahr kleiner oder grösser als 1950 sein?'] }
];
function zeigeErgebnis(a){
  var aus = $('ausgabe'); aus.innerHTML = '';
  var r = SqlSzene.abfrage(sqlVon(a, a.loes));
  if (r.zaehlen) {
    aus.innerHTML = '<div class="treffer">ANZAHL</div><div class="karte" style="max-width:14em"><strong style="font-size:2.4em">' + r.wert + '</strong><span>Personen erfüllen die Bedingung</span></div>';
    return;
  }
  var raster = document.createElement('div'); raster.className = 'karten'; aus.appendChild(raster);
  r.zeilen.forEach(function(z, n){
    var k = document.createElement('div'); k.className = 'karte'; k.style.animationDelay = (Math.min(n, 24) * 0.03) + 's';
    var titel = r.spalten.indexOf('name') >= 0 ? z.name : '#' + z.id;
    var html = '<strong>' + titel + '</strong>';
    r.spalten.forEach(function(sp, i){ if (sp !== 'name') html += '<span>' + SqlSzene.text(sp) + ': ' + SqlSzene.text(r.werte ? r.werte[n][i] : z[sp]) + '</span>'; });
    k.innerHTML = html; raster.appendChild(k);
  });
}
function sqlVon(a, werte){ return a.segs.map(function(s){ return typeof s === 'number' ? (werte[s] || '?') : s; }).join(' '); }
AUFGABEN.forEach(function(a){
  var r = SqlSzene.abfrage(sqlVon(a, a.loes));
  a.treffer = r.zaehlen ? r.wert : r.zeilen.length;
  if (!a.treffer) console.warn('Datensatz: Aufgabe ohne Treffer');
});

/* ---- Ton ---- */
var ctx = null, master = null;
function tonStart(){ if (ctx) return; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination); }
function ton(freq, dauer, typ, laut, verz){ if (!ctx || ctx.state !== 'running') return;
  var t = ctx.currentTime + (verz || 0), o = ctx.createOscillator(), g = ctx.createGain();
  o.type = typ || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(laut || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dauer + 0.02); }
var KLANG = {
  klick: function(){ ton(900, 0.05, 'triangle', 0.15); },
  erfolg: function(){ ton(523, 0.3, 'sine', 0.2); ton(659, 0.3, 'sine', 0.2, 0.1); ton(784, 0.5, 'sine', 0.2, 0.2); },
  fehler: function(){ ton(160, 0.18, 'sawtooth', 0.12); ton(120, 0.25, 'sawtooth', 0.12, 0.12); },
  geschafft: function(){
    [523, 659, 784, 1047].forEach(function(f, i){ ton(f, 0.28, 'triangle', 0.2, i * 0.11); });
    ton(1047, 0.9, 'sine', 0.16, 0.44); ton(1319, 0.9, 'sine', 0.12, 0.44); ton(1568, 0.9, 'sine', 0.1, 0.44);
    ton(2093, 0.18, 'sine', 0.07, 0.6); ton(2637, 0.18, 'sine', 0.06, 0.7);
  }
};
tonStart();
document.addEventListener('pointerdown', function(){ if (ctx && ctx.state !== 'running') ctx.resume(); });
function klang(n){ try { KLANG[n](); } catch (e) {} }

var $ = function(id){ return document.getElementById(id); };
Spiel.zeichneEnergie($('hud-energie'));
function meldung(art, text){ $('meldung').className = art; $('meldung').textContent = text; }

/* ---- Ablauf ---- */
var nr = 0, erledigt = false, belegt = [], gewaehlt = null;
for (var i = 0; i < AUFGABEN.length; i++) $('punkte').appendChild(document.createElement('i'));

function setze(nummer, zeichen){
  if (erledigt) return;
  belegt[nummer] = zeichen; zeichneCode(); klang('klick');
}
function zeichneCode(zustand){
  var a = AUFGABEN[nr], bau = $('bau'); bau.innerHTML = '';
  a.segs.forEach(function(s){
    if (typeof s === 'string') { var t = document.createElement('span'); t.textContent = s; bau.appendChild(t); return; }
    var l = document.createElement('span'); l.className = 'luecke' + (belegt[s] ? ' voll' : '') + (zustand && zustand[s] ? ' ' + zustand[s] : '');
    l.textContent = belegt[s] || '?'; l.tabIndex = 0; l.setAttribute('role', 'button'); l.setAttribute('aria-label', 'Lücke ' + (s + 1) + (belegt[s] ? ': ' + belegt[s] : ''));
    l.addEventListener('dragover', function(e){ if (erledigt) return; e.preventDefault(); l.classList.add('ueber'); });
    l.addEventListener('dragleave', function(){ l.classList.remove('ueber'); });
    l.addEventListener('drop', function(e){
      e.preventDefault(); l.classList.remove('ueber');
      var z = e.dataTransfer && e.dataTransfer.getData('text/plain');
      if (z === '<' || z === '>') setze(s, z);
    });
    // Ohne Maus (Tippen, Tastatur): Zeichen antippen, dann die Lücke antippen. Ein Klick auf eine volle Lücke leert sie.
    l.addEventListener('click', function(){
      if (erledigt) return;
      if (gewaehlt) { setze(s, gewaehlt); }
      else if (belegt[s]) { belegt[s] = null; zeichneCode(); klang('klick'); }
    });
    l.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); l.click(); } });
    bau.appendChild(l);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('.zeichen-tile'), function(k){
  k.addEventListener('dragstart', function(e){ if (erledigt) { e.preventDefault(); return; } e.dataTransfer.setData('text/plain', k.getAttribute('data-z')); e.dataTransfer.effectAllowed = 'copy'; });
  k.addEventListener('click', function(){
    var z = k.getAttribute('data-z');
    gewaehlt = gewaehlt === z ? null : z;
    Array.prototype.forEach.call(document.querySelectorAll('.zeichen-tile'), function(t){ t.classList.toggle('gewaehlt', t.getAttribute('data-z') === gewaehlt); });
    klang('klick');
  });
});

function zeigeAufgabe(){
  var a = AUFGABEN[nr];
  erledigt = false; belegt = []; gewaehlt = null;
  Array.prototype.forEach.call(document.querySelectorAll('.zeichen-tile'), function(t){ t.classList.remove('gewaehlt'); });
  $('kopfzeile').textContent = 'AUFGABE ' + (nr + 1) + ' VON ' + AUFGABEN.length;
  Array.prototype.forEach.call($('punkte').children, function(p, k){ p.className = k < nr ? 'fertig' : k === nr ? 'aktuell' : ''; });
  $('auftrag').innerHTML = '<b class="kicker">DER BEFEHL IN WORTEN</b>' + a.wort;
  meldung('', ''); $('weiter').hidden = true; $('pruefen').hidden = false; $('ausgabe').innerHTML = '';
  zeichneCode();
}

$('pruefen').onclick = function(){
  if (erledigt) return;
  var a = AUFGABEN[nr], zustand = {}, offen = 0, falsch = [];
  a.loes.forEach(function(z, i){
    if (!belegt[i]) offen++;
    else if (belegt[i] !== z) { zustand[i] = 'falsch'; falsch.push(i); }
    else zustand[i] = 'richtig';
  });
  if (offen) { meldung('fehler', 'Ziehe zuerst in jede Lücke ein < oder >.'); klang('fehler'); return; }
  if (falsch.length) {
    zeichneCode(zustand);
    meldung('fehler', 'Noch nicht ganz. ' + a.frage[falsch[0]]);
    klang('fehler');
    // Falsche Lücken werden wieder frei, die richtigen bleiben stehen
    falsch.forEach(function(i){ belegt[i] = null; });
    setTimeout(function(){ if (!erledigt) zeichneCode(); }, 900);
    return;
  }
  erledigt = true; zeichneCode(zustand);
  Array.prototype.forEach.call($('punkte').children, function(p, k){ if (k <= nr) p.className = 'fertig'; });
  var unter = a.treffer === 1 ? 'Person' : 'Personen';
  meldung('ok', 'Richtig! Diese Abfrage liefert ' + (a.segs[0].indexOf('COUNT') >= 0 ? 'die Zahl ' + a.treffer + '.' : a.treffer + ' ' + unter + '.'));
  $('pruefen').hidden = true; $('weiter').textContent = nr + 1 < AUFGABEN.length ? 'Weiter ▸' : 'Fertig ▸'; $('weiter').hidden = false;
  zeigeErgebnis(a);
  klang('erfolg'); $('weiter').focus();
};
$('weiter').onclick = function(){
  klang('klick');
  if (nr + 1 < AUFGABEN.length) { nr++; zeigeAufgabe(); } else fertig();
};

function fertig(){
  var erstesMal = Spiel.sidequestGeschafft('4.1');
  if (erstesMal) Spiel.energiePlus(1);
  klang('geschafft');
  $('fertig-text').textContent = erstesMal
    ? 'Du weisst jetzt sicher, wann < und wann > gehört. Dein Gehirn hat einen Energiebalken gewonnen.'
    : 'Du weisst jetzt sicher, wann < und wann > gehört. Die Energie für diese Sidequest hattest du schon.';
  $('fertig').hidden = false;
}
function zurKarte(){ location.href = Spiel.url('zentrale.html', { z:4, r:1 }); }      // zurück in die Hauptzentrale
$('zurueck').onclick = zurKarte;
$('fertig-weiter').onclick = zurKarte;
zeigeAufgabe();
</script>
</body>
</html>
