<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBI — Wähle deinen Charakter</title>
<style>
  /* Charakterwahl: Startseite → „Storymodus“ (neues Spiel) → hier → Aufnahmeprüfung.
     Aussehen 1:1 wie die Portale auf der Startseite (HBI.html), nur grösser und mit Porträt. */
  :root{
    --bg1: #0a0f24;
    --bg2: #131c3d;
    --gold: #d4af37;
    --gold-dim: #8f7a3f;
    --fg: #eae6d8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{font-size:clamp(16px, min(1.25vw, 2.2vh), 44px);}  /* gleiche Skalierung wie die Startseite */
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% -10%, var(--bg2), var(--bg1) 60%);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    padding: 1.5rem;
  }
  .buehne{ text-align:center; transition: opacity .7s ease; }
  body.weg .buehne{ opacity: 0; }
  h1{
    margin: 0 0 2.75rem;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--gold);
    letter-spacing: 0.04em;
    text-shadow: 0 0 1.125rem rgba(212,175,55,0.25);
  }
  .portale{
    display:flex;
    gap: 3.5rem;
    justify-content:center;
    flex-wrap: wrap;
  }
  /* Rand, innerer Ring und Hover-Effekt genau wie button.portal auf der Startseite */
  button.portal{
    font-family: inherit;
    cursor:pointer;
    width: min(20rem, 40vw);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 40%, rgba(212,175,55,0.10), transparent 60%),
      var(--bg2);
    border: 2px solid var(--gold-dim);
    padding: 0;
    position: relative;
    overflow: hidden;                      /* Porträt bleibt im Kreis */
    -webkit-tap-highlight-color: transparent;
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  button.portal::before{
    content:"";
    position:absolute;
    inset: 0.625rem;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.25);
    z-index: 1;
    pointer-events: none;
  }
  button.portal svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  button.portal:hover, button.portal:focus-visible{
    border-color: var(--gold);
    box-shadow: 0 0 1.875rem rgba(212,175,55,0.25);
    transform: translateY(-4px);
    outline:none;
  }
  button.portal:focus{ outline:none; }
  button.portal:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }
  @media (prefers-reduced-motion: reduce){
    button.portal, .buehne{ transition:none; }
  }
</style>
</head>
<body>
  <main class="buehne" role="main">
    <h1>Wähle deinen Charakter</h1>

    <nav class="portale" aria-label="Charakter wählen">
      <!-- Charakter 1: kurze blaugraue Haare (die bisherige Figur, jetzt mit Gesicht) -->
      <button class="portal" data-charakter="1" onclick="waehle(this)" aria-label="Charakter 1 wählen">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <path d="M40,206 L52,148 Q100,122 148,148 L160,206Z" fill="#0b0f1f" stroke="#8f7a3f" stroke-width="2"/>
          <path d="M84,134 L100,162 L116,134" fill="none" stroke="#9fe59f" stroke-width="3"/>
          <path d="M100,162 L100,206" stroke="#9fe59f" stroke-opacity=".35" stroke-width="2"/>
          <path d="M62,152 L70,206" stroke="#2d4a6b" stroke-width="7" stroke-linecap="round"/>
          <circle cx="100" cy="84" r="40" fill="#0b0f1f" stroke="#8f7a3f" stroke-width="2"/>
          <path d="M59,82 Q57,40 100,40 Q143,40 141,82 Q134,58 100,55 Q66,58 59,82Z" fill="#3a4a7a"/>
          <path d="M78,76 Q85,72 92,75 M108,75 Q115,72 122,76" fill="none" stroke="#3a4a7a" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="86" cy="86" rx="3.2" ry="4" fill="#eae6d8"/>
          <ellipse cx="114" cy="86" rx="3.2" ry="4" fill="#eae6d8"/>
          <path d="M100,90 L98,98 L102,98" fill="none" stroke="#8f7a3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M90,106 Q100,113 110,106" fill="none" stroke="#eae6d8" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Charakter 2: lange offene Haare (kupferbraun), Seitenscheitel -->
      <button class="portal" data-charakter="2" onclick="waehle(this)" aria-label="Charakter 2 wählen">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <path d="M58,84 Q54,36 100,36 Q146,36 142,84 L150,170 Q136,180 124,168 L120,114 L80,114 L76,168 Q64,180 50,170Z" fill="#7a4a2a"/>
          <path d="M40,206 L52,148 Q100,122 148,148 L160,206Z" fill="#0b0f1f" stroke="#8f7a3f" stroke-width="2"/>
          <path d="M84,134 L100,162 L116,134" fill="none" stroke="#9fe59f" stroke-width="3"/>
          <path d="M100,162 L100,206" stroke="#9fe59f" stroke-opacity=".35" stroke-width="2"/>
          <path d="M54,152 Q60,174 52,206 M146,152 Q140,174 148,206" fill="none" stroke="#7a4a2a" stroke-width="10" stroke-linecap="round"/>
          <circle cx="100" cy="84" r="40" fill="#0b0f1f" stroke="#8f7a3f" stroke-width="2"/>
          <path d="M60,86 Q56,42 100,42 Q144,42 140,86 Q136,62 112,56 Q92,54 80,64 Q68,72 60,86Z" fill="#7a4a2a"/>
          <path d="M78,77 Q85,73 92,76 M108,76 Q115,73 122,77" fill="none" stroke="#7a4a2a" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="86" cy="87" rx="3.2" ry="4" fill="#eae6d8"/>
          <ellipse cx="114" cy="87" rx="3.2" ry="4" fill="#eae6d8"/>
          <path d="M82,81 L80,79 M118,81 L120,79" stroke="#eae6d8" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M100,91 L98,99 L102,99" fill="none" stroke="#8f7a3f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M90,107 Q100,114 110,107" fill="none" stroke="#eae6d8" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </nav>
  </main>

  <script>
    // Neues Spiel mit dem gewählten Charakter (c); spielstand.js trägt ihn von dort durch alle Szenen und in den Spielstand.
    function waehle(btn){
      var c = btn.getAttribute('data-charakter');
      document.body.classList.add('weg');
      setTimeout(function(){ location.href = 'szene_aufnahmepruefung.html#e=3&f=0&c=' + c; }, 700);
    }
  </script>
</body>
</html>
