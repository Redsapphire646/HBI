<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBI — Sidequest 2.2: Personen suchen</title>
<style>
  :root{
    --bg1:#0a0f24; --bg2:#131c3d; --gold:#d4af37; --gold-dim:#8f7a3f;
    --fg:#eae6d8; --papier:#efe6cf; --tinte:#2b1d14; --gruen:#9fe59f; --rot:#e0735f;
    --serif: Georgia, "Times New Roman", serif;
    --mono: Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{margin:0;height:100%;background:#05070f;}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--fg);}

  #buehne{
    position:relative; width:min(100vw, 177.78vh); aspect-ratio:16/9; overflow:hidden;
    container-type:inline-size; background:radial-gradient(circle at 50% -10%,var(--bg2),var(--bg1) 60%);
  }
  #gehirn-hud{position:absolute;top:3.5%;left:2.5%;display:flex;flex-direction:column;gap:.35cqw;
    background:rgba(10,15,36,.8);border:1px solid var(--gold-dim);padding:.6cqw 1.1cqw;font-size:max(15px,1.9cqw);}
  #gehirn-hud .hud-label{font-size:max(9px,.8cqw);letter-spacing:.25em;color:var(--gold-dim);}
  #kopf{position:absolute;top:3.5%;left:0;right:0;text-align:center;pointer-events:none;}
  #kopf .kicker{letter-spacing:.35em;font-size:max(10px,.9cqw);color:var(--gold-dim);}
  #kopf h1{margin:.15em 0 0;color:var(--gold);font-size:max(20px,2.8cqw);text-shadow:0 0 18px rgba(212,175,55,.3);}
  #zurueck{position:absolute;top:3.5%;right:2.5%;font-family:var(--serif);font-size:max(11px,1cqw);
    background:rgba(10,15,36,.8);color:var(--gold);border:1px solid var(--gold-dim);padding:.4cqw .9cqw;cursor:pointer;}
  #zurueck:hover{background:rgba(212,175,55,.12);}

  #maske{position:absolute;left:5%;right:5%;top:24%;bottom:2.5%;display:flex;flex-direction:column;gap:.8cqw;padding:1.1cqw 1.4cqw;
    background:#0b1020;border:2px solid var(--gold-dim);box-shadow:0 0 3cqw rgba(212,175,55,.15);
    font-family:var(--mono);font-size:max(11px,1.1cqw);}
  #maske > *{flex:none;}
  #maske header{display:flex;justify-content:space-between;align-items:center;color:var(--gold);letter-spacing:.08em;
    border-bottom:1px solid var(--gold-dim);padding-bottom:.6cqw;}
  #punkte{display:flex;gap:.5cqw;}
  #punkte i{display:block;width:1.1cqw;height:1.1cqw;border-radius:50%;border:1px solid var(--gold-dim);}
  #punkte i.aktuell{border-color:var(--gold);box-shadow:0 0 .6cqw rgba(212,175,55,.6);}
  #punkte i.fertig{background:var(--gruen);border-color:var(--gruen);}
  #auftrag{background:var(--papier);color:var(--tinte);padding:.8cqw 1cqw;font-family:var(--serif);font-size:max(13px,1.35cqw);line-height:1.4;
    box-shadow:0 .2cqw .6cqw rgba(0,0,0,.4);border-left:.35cqw solid #8b2e1f;}
  #auftrag b{display:block;letter-spacing:.2em;font-size:.6em;color:#8b2e1f;margin-bottom:.3em;}
  #auftrag u{text-decoration-thickness:.12em;}

  .bausteine-zeile{display:flex;flex-wrap:wrap;align-items:center;gap:.7cqw;}
  .bausteine-zeile .b-label{color:#b9b6ad;}
  .baustein,.schema .chip{border:none;border-radius:.5cqw;padding:.25cqw .9cqw;cursor:pointer;font:inherit;font-weight:bold;color:#0b1020;
    box-shadow:0 .15cqw 0 rgba(0,0,0,.45), inset 0 -.15cqw 0 rgba(0,0,0,.18);}
  .baustein{background:#d4af37;}
  .schema{display:flex;flex-wrap:wrap;align-items:center;gap:.3cqw;}
  .schema .b-label{color:#b9b6ad;margin-right:.4cqw;}
  .schema .chip{background:#5fa8e8;padding:.1cqw .65cqw;font-size:.92em;}
  .baustein:hover,.baustein:focus-visible,.schema .chip:hover,.schema .chip:focus-visible{filter:brightness(1.15);outline:none;}
  .baustein:active,.schema .chip:active{transform:translateY(1px);}
  .eingabe-zeile{display:grid;grid-template-columns:1fr auto;gap:.8cqw;align-items:stretch;}
  #eingabe{width:100%;min-height:3.6em;resize:none;background:#050810;color:var(--gruen);border:1px solid #2c3a2c;
    font:inherit;font-size:1.15em;padding:.6em;caret-color:var(--gruen);}
  #eingabe:focus{outline:1px solid var(--gruen);}
  #eingabe::placeholder{color:#5f7d5f;font-style:italic;opacity:1;}
  .knoepfe{display:flex;flex-direction:column;gap:.6cqw;}
  .knoepfe button{font:inherit;cursor:pointer;padding:.45cqw 1.2cqw;border:1px solid var(--gold);white-space:nowrap;}
  #los{background:var(--gold);color:#0b1020;font-weight:bold;}
  #weiter{background:none;color:var(--gruen);border-color:var(--gruen);font-weight:bold;}
  #meldung{min-height:1.5em;line-height:1.4;}
  #meldung.fehler{color:var(--rot);} #meldung.ok{color:var(--gruen);}
  #ausgabe{flex:1 1 0;min-height:0;overflow:auto;padding:1cqw .2cqw 0;border-top:1px solid rgba(143,122,63,.4);}
  .treffer{color:var(--gold);margin-bottom:.8cqw;letter-spacing:.05em;}
  .karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(120px,13cqw),1fr));gap:.8cqw;}
  .karte{background:var(--papier);color:var(--tinte);padding:.6cqw .8cqw;font-family:var(--serif);
    border-top:.35cqw solid #8b2e1f;box-shadow:0 .2cqw .5cqw rgba(0,0,0,.4);animation:rein .25s ease-out both;}
  .karte.wahl{cursor:pointer;}
  .karte.wahl:hover,.karte.wahl:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .karte.richtig{outline:3px solid var(--gruen);outline-offset:2px;cursor:default;}
  .karte.falsch{animation:wackeln .35s;outline:2px solid var(--rot);outline-offset:2px;}
  .karte strong{display:block;font-size:1.05em;margin-bottom:.2em;}
  .karte span{display:block;font-size:.85em;opacity:.8;}
  @keyframes rein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes wackeln{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .leer{color:#b9b6ad;font-style:italic;}

  #fertig{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2cqw;background:rgba(5,8,18,.9);}
  #fertig h2{margin:0;color:var(--gold);font-size:max(22px,3.6cqw);text-shadow:0 0 18px rgba(212,175,55,.3);}
  #fertig p{margin:0;max-width:56%;color:#d6d1c0;font-size:max(13px,1.5cqw);line-height:1.5;}
  #fertig button{font-family:var(--serif);font-size:max(13px,1.3cqw);background:none;color:var(--gold);border:1px solid var(--gold);padding:.6cqw 1.6cqw;cursor:pointer;margin-top:.6cqw;}
  #fertig button:hover{background:rgba(212,175,55,.12);}

  @media (prefers-reduced-motion: reduce){ *{animation-duration:0s !important;transition-duration:0s !important;} }
</style>
</head>
<body>
<div id="buehne">
  <div id="gehirn-hud" title="Energie"><div class="hud-label">ENERGIE</div><div id="hud-energie"></div></div>
  <div id="kopf"><div class="kicker">SIDEQUEST 2.2</div><h1>Personen suchen</h1></div>
  <button type="button" id="zurueck">◂ Zur Zentrale</button>

  <div id="maske" role="group" aria-label="Person suchen">
    <header><span id="kopfzeile">SUCHE</span><span id="punkte" aria-hidden="true"></span></header>
    <div id="auftrag"></div>
    <div id="bausteine" class="bausteine-zeile">
      <span class="b-label">Grundbausteine:</span>
      <button type="button" class="baustein" data-text="SELECT * FROM personen">SELECT * FROM personen</button>
      <button type="button" class="baustein" data-text="SELECT COUNT(*) FROM personen">SELECT COUNT(*) FROM personen</button>
    </div>
    <div class="schema"><span class="b-label">Spalten:</span><span id="chips"></span></div>
    <div class="eingabe-zeile">
      <textarea id="eingabe" spellcheck="false" aria-label="SQL-Abfrage" placeholder="SQL Abfrage hier eingeben"></textarea>
      <div class="knoepfe">
        <button type="button" id="los">▶ Ausführen</button>
        <button type="button" id="weiter" hidden>Weiter ▸</button>
      </div>
    </div>
    <div id="meldung" role="status"></div>
    <div id="ausgabe"></div>
  </div>

  <div id="fertig" hidden>
    <h2>Geschafft!</h2>
    <p id="fertig-text"></p>
    <button type="button" id="fertig-weiter">Zurück zur Zentrale ▸</button>
  </div>
</div>

<script src="spielstand.js"></script>
<script src="../daten/personen.js" charset="utf-8"></script>
<script src="sql-asm.js" charset="utf-8"></script>
<script src="sql-meldungen.js" charset="utf-8"></script>
<script src="sql-szene.js" charset="utf-8"></script>
<script>
/* ============================================================
   AUFGABEN — vier Personen suchen. Die Frage nennt die Spalten wie die SQL-Abfrage (herkunft, wirkungsbereich …).
   Gelernt sind: SELECT, FROM, WHERE, AND, =, Text/Zahl. Die gesuchte Person wird aus den Daten bestimmt;
   zu jeder Aufgabe passt genau eine Person. Zum Weitergehen muss ihre Karte angeklickt werden.
   ============================================================ */
var AUFGABEN = [
  { bed:[ { spalte:'herkunft', wert:'Frankreich' }, { spalte:'wirkungsbereich', wert:'Kunst' } ] },
  { bed:[ { spalte:'herkunft', wert:'Mexiko' }, { spalte:'geschlecht', wert:'weiblich' } ] },
  { bed:[ { spalte:'herkunft', wert:'Schweden' }, { spalte:'wirkungsbereich', wert:'Gesellschaft' } ] },
  { bed:[ { spalte:'wirkungsbereich', wert:'Politik' }, { spalte:'geburtsjahr', wert:1961 } ] }
];
function wert(b){ return typeof b.wert === 'string' ? b.wert : String(b.wert); }
AUFGABEN.forEach(function(a){
  var treffer = DATEN.filter(function(p){ return a.bed.every(function(b){ return p[b.spalte] === b.wert; }); });
  if (treffer.length !== 1) console.warn('Datensatz: Aufgabe hat ' + treffer.length + ' statt genau 1 Person: ' + a.bed.map(function(b){ return b.spalte + '=' + b.wert; }).join(', '));
  a.person = treffer[0] || null;
  var teile = a.bed.map(function(b){ return '<u>' + b.spalte + '</u> ' + wert(b); });
  a.auftrag = 'Finde die Person mit ' + teile.join(' und ') + '. Klicke ihre Karteikarte an.';
});

/* ---- Ton ---- */
var ctx = null, master = null;
function tonStart(){ if (ctx) return; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination); }
function ton(freq, dauer, typ, laut, verz){ if (!ctx || ctx.state !== 'running') return;
  var t = ctx.currentTime + (verz || 0), o = ctx.createOscillator(), g = ctx.createGain();
  o.type = typ || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(laut || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dauer + 0.02); }
var KLANG = {
  klick: function(){ ton(900, 0.05, 'triangle', 0.15); },
  erfolg: function(){ ton(523, 0.3, 'sine', 0.2); ton(659, 0.3, 'sine', 0.2, 0.1); ton(784, 0.5, 'sine', 0.2, 0.2); },
  fehler: function(){ ton(160, 0.18, 'sawtooth', 0.12); ton(120, 0.25, 'sawtooth', 0.12, 0.12); },
  geschafft: function(){
    [523, 659, 784, 1047].forEach(function(f, i){ ton(f, 0.28, 'triangle', 0.2, i * 0.11); });
    ton(1047, 0.9, 'sine', 0.16, 0.44); ton(1319, 0.9, 'sine', 0.12, 0.44); ton(1568, 0.9, 'sine', 0.1, 0.44);
    ton(2093, 0.18, 'sine', 0.07, 0.6); ton(2637, 0.18, 'sine', 0.06, 0.7);
  }
};
tonStart();
document.addEventListener('pointerdown', function(){ if (ctx && ctx.state !== 'running') ctx.resume(); });
function klang(n){ try { KLANG[n](); } catch (e) {} }

var $ = function(id){ return document.getElementById(id); };
function abfrage(q){ return SqlSzene.abfrage(q); }
Spiel.zeichneEnergie($('hud-energie'));

/* ---- Spalten-Buttons und Grundbausteine (wie im Story-Modus) ---- */
function einfuegen(txt){
  if (gefunden) return;
  var e = $('eingabe'), a = e.selectionStart, z = e.selectionEnd;
  var vor = e.value.slice(0, a), leer = vor && !/\s$/.test(vor) ? ' ' : '';
  e.value = vor + leer + txt + e.value.slice(z);
  e.focus(); e.selectionStart = e.selectionEnd = a + leer.length + txt.length;
}
SPALTEN.forEach(function(s){
  var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s;
  b.onclick = function(){ klang('klick'); einfuegen(s); }; $('chips').appendChild(b);
});
document.querySelectorAll('#bausteine .baustein').forEach(function(b){
  b.onclick = function(){
    if (gefunden) return;
    var e = $('eingabe'), text = b.getAttribute('data-text'), ok = false;
    e.focus(); e.select();
    try { ok = document.execCommand('insertText', false, text); } catch (x) {}
    if (!ok || e.value !== text) e.value = text;
    e.selectionStart = e.selectionEnd = e.value.length;
  };
});

/* ---- Ablauf ---- */
var nr = 0, gefunden = false;
for (var i = 0; i < AUFGABEN.length; i++) $('punkte').appendChild(document.createElement('i'));

function zeigeAufgabe(){
  var a = AUFGABEN[nr];
  gefunden = false;
  $('kopfzeile').textContent = 'SUCHE ' + (nr + 1) + ' VON ' + AUFGABEN.length;
  Array.prototype.forEach.call($('punkte').children, function(p, k){ p.className = k < nr ? 'fertig' : k === nr ? 'aktuell' : ''; });
  $('auftrag').innerHTML = '<b>AUFTRAG · SUCHE ' + (nr + 1) + '</b>' + a.auftrag;
  $('eingabe').value = ''; $('ausgabe').innerHTML = '';
  $('meldung').className = ''; $('meldung').textContent = '';
  $('weiter').hidden = true; $('los').disabled = false; $('eingabe').disabled = false;
  $('eingabe').focus();
}

function ausfuehren(){
  if (gefunden) return;
  var m = $('meldung'), aus = $('ausgabe'), a = AUFGABEN[nr];
  try {
    var text = $('eingabe').value;
    if (/_{2,}/.test(text)) throw { fehler:'Die Unterstriche ____ sind nur Platzhalter. Ersetze sie durch die passenden Werte.' };
    var r = abfrage(text);
    aus.innerHTML = '';
    if (r.zaehlen) {
      m.className = 'fehler'; m.textContent = 'Zählen zeigt nur eine Zahl. Du brauchst die Karteikarte: Nutze SELECT *.';
      aus.innerHTML = '<div class="treffer">ANZAHL</div><div class="karte" style="max-width:14em"><strong style="font-size:2.4em">' + r.zeilen.length + '</strong><span>Personen erfüllen die Bedingung</span></div>';
      klang('fehler'); return;
    }
    if (r.art === 'zahl' || r.art === 'tabelle') { aus.innerHTML = SqlSzene.alsTabelle(r); m.className = ''; m.textContent = ''; return; }
    if (!r.zeilen.length) { aus.insertAdjacentHTML('beforeend', '<p class="leer">Keine Person passt. Prüfe die Schreibweise des Wertes.</p>'); m.className = ''; m.textContent = ''; klang('fehler'); return; }
    m.className = ''; m.textContent = 'Klicke die Karteikarte der gesuchten Person an.';
    var raster = document.createElement('div'); raster.className = 'karten'; aus.appendChild(raster);
    r.zeilen.forEach(function(z, n){
      var k = document.createElement('div'); k.className = 'karte wahl'; k.style.animationDelay = (Math.min(n, 24) * 0.03) + 's';
      k.tabIndex = 0; k.setAttribute('role', 'button');
      var titel = r.spalten.indexOf('name') >= 0 ? z.name : '#' + z.id;
      var html = '<strong>' + titel + '</strong>';
      r.spalten.forEach(function(s, i){ if (s !== 'name') html += '<span>' + SqlSzene.text(s) + ': ' + SqlSzene.text(r.werte ? r.werte[n][i] : z[s]) + '</span>'; });
      k.innerHTML = html;
      var klick = function(){ karteGeklickt(k, z, r.zeilen.length); };
      k.addEventListener('click', klick);
      k.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); klick(); } });
      raster.appendChild(k);
    });
  } catch (err) {
    if (!err.fehler) throw err;
    m.className = 'fehler'; m.textContent = '✗ ' + err.fehler; klang('fehler');
  }
}
function karteGeklickt(k, z, anzahl){
  if (gefunden) return;
  var a = AUFGABEN[nr], m = $('meldung');
  if (z === a.person) {
    gefunden = true; k.classList.remove('falsch'); k.classList.add('richtig');
    m.className = 'ok';
    m.textContent = 'Gefunden: ' + z.name + '!' + (anzahl > 3 ? ' Mit WHERE … AND … kannst du die Liste noch kleiner machen.' : '');
    Array.prototype.forEach.call($('punkte').children, function(p, i){ if (i <= nr) p.className = 'fertig'; });
    $('weiter').textContent = nr + 1 < AUFGABEN.length ? 'Nächste Suche ▸' : 'Fertig ▸';
    $('weiter').hidden = false; $('los').disabled = true; $('eingabe').disabled = true;
    klang('erfolg'); $('weiter').focus();
  } else {
    k.classList.remove('falsch'); void k.offsetWidth; k.classList.add('falsch');
    m.className = 'fehler'; m.textContent = 'Das ist nicht die gesuchte Person. Vergleiche die Karte mit dem Auftrag.';
    klang('fehler');
  }
}
$('los').onclick = ausfuehren;
$('eingabe').addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ausfuehren(); } });
$('weiter').onclick = function(){
  klang('klick');
  if (nr + 1 < AUFGABEN.length) { nr++; zeigeAufgabe(); } else fertig();
};

/* ---- Geschafft: Energie wird aufgefüllt (einmal pro Sidequest) ---- */
function fertig(){
  var erstesMal = Spiel.sidequestGeschafft('2.2');
  if (erstesMal) Spiel.energiePlus(1);
  klang('geschafft');
  $('fertig-text').textContent = erstesMal
    ? 'Alle vier Personen gefunden. Dein Gehirn hat einen Energiebalken gewonnen.'
    : 'Alle vier Personen gefunden. Die Energie für diese Sidequest hattest du schon.';
  $('fertig').hidden = false;
}
function zurKarte(){ location.href = Spiel.url('zentrale.html', { z:2, r:1 }); }      // zurück in die Hauptzentrale
$('zurueck').onclick = zurKarte;
$('fertig-weiter').onclick = zurKarte;
zeigeAufgabe();
</script>
</body>
</html>
